version: 2

models:
  - name: stg_orders
    description: Typed fictional order lines. Grain is order_id + product_id.
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price_yen
        tests: [not_null]
      - name: line_revenue_yen
        tests: [not_null]
    tests:
      - unique:
          column_name: "order_id || '-' || product_id"
  - name: stg_products
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_name
        tests: [not_null]
      - name: category
        tests: [not_null]
